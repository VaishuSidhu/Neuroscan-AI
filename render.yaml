services:
  - type: web
    name: neuroscan-backend
    env: python
    rootDir: backend
    buildCommand: pip install uv && uv pip install --python $(which python) torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt --no-cache-dir
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: neuroscan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODE
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: MALLOC_ARENA_MAX
        value: "2"
    healthCheckPath: /api/health

  - type: web
    name: neuroscan-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        value: https://neuroscan-backend-zqas.onrender.com

databases:
  - name: neuroscan-db
    databaseName: neuroscan
    user: neuroscan
    plan: free
